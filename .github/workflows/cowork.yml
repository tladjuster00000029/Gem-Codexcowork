name: Gemini + Codex cowork
on:
  workflow_dispatch:
    inputs:
      task:
        description: 구현할 기능 또는 수정할 문제를 구체적으로 입력하세요
        type: string
        required: true
      gemini_model:
        description: 계정에서 사용 가능한 Gemini 모델 ID
        type: string
        required: true
      codex_model:
        description: 계정에서 사용 가능한 Codex 모델 ID
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cowork-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TASK: ${{ inputs.task }}
      GEMINI_MODEL: ${{ inputs.gemini_model }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate configuration
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$OPENAI_KEY" || { echo 'Add OPENAI_API_KEY to repository secrets'; exit 1; }
          test -n "$GEMINI_KEY" || { echo 'Add GEMINI_API_KEY to repository secrets'; exit 1; }
      - run: npm test
      - name: Gemini planning
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COWORK_DIAGNOSTIC_FILE: ${{ runner.temp }}/api-diagnostic.jsonl
        run: node scripts/cowork.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: cowork-plan
          path: |
            ${{ runner.temp }}/cowork.patch
            ${{ runner.temp }}/cowork-prompt.md
            ${{ runner.temp }}/cowork-report.md
          if-no-files-found: error
      - name: Retain sanitized API diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-diagnostic-plan
          path: ${{ runner.temp }}/api-diagnostic.jsonl
          if-no-files-found: ignore
  first:
    needs: plan
    uses: ./.github/workflows/round.yml
    with:
      task: ${{ inputs.task }}
      gemini_model: ${{ inputs.gemini_model }}
      codex_model: ${{ inputs.codex_model }}
      round: '1'
      input_artifact: cowork-plan
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  second:
    needs: first
    if: needs.first.outputs.approved != 'true'
    uses: ./.github/workflows/round.yml
    with:
      task: ${{ inputs.task }}
      gemini_model: ${{ inputs.gemini_model }}
      codex_model: ${{ inputs.codex_model }}
      round: '2'
      input_artifact: ${{ needs.first.outputs.artifact }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  third:
    needs: [first, second]
    if: needs.first.outputs.approved != 'true' && needs.second.outputs.approved != 'true'
    uses: ./.github/workflows/round.yml
    with:
      task: ${{ inputs.task }}
      gemini_model: ${{ inputs.gemini_model }}
      codex_model: ${{ inputs.codex_model }}
      round: '3'
      input_artifact: ${{ needs.second.outputs.artifact }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  propose:
    needs: [first, second, third]
    if: >-
      always() && !cancelled() &&
      ((needs.first.result == 'success' && needs.first.outputs.approved == 'true') ||
       (needs.second.result == 'success' && needs.second.outputs.approved == 'true') ||
       needs.third.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.third.outputs.artifact || needs.second.outputs.artifact || needs.first.outputs.artifact }}
          path: ${{ runner.temp }}/result
      - name: Validate patch with trusted control code
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {validatePatch} from "./scripts/cowork-patch.mjs"; validatePatch(readFileSync(process.env.RUNNER_TEMP + "/result/cowork.patch", "utf8"));'
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/result/cowork.patch"
          if [ ! -s "$patch" ]; then
            echo 'No code changes. See cowork-round artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git apply --check "$patch"
          git apply "$patch"
          git add -N .
          if git diff --name-only | grep -E '^([.]github/|approval/|open-approval[.]cmd$|[.]gitignore$|package[.]json$|AGENTS[.]md$|scripts/cowork.*[.]mjs$)'; then
            echo 'Refusing changes to automation control files'
            exit 1
          fi
          branch="cowork/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Implement Gemini–Codex collaboration task'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --draft --head "$branch" --title 'Gemini + Codex: proposed changes' --body-file "$RUNNER_TEMP/result/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run test.yml --ref "$branch"
