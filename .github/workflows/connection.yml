name: Check API connections
on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: Gemini 모델 ID
        type: string
        required: true
      codex_model:
        description: Codex 모델 ID
        type: string
        required: true
permissions:
  contents: read
jobs:
  gemini:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Gemini generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          COWORK_DIAGNOSTIC_FILE: ${{ runner.temp }}/api-diagnostic.jsonl
        run: node scripts/cowork-probe.mjs
      - name: Retain sanitized API diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-diagnostic-connection
          path: ${{ runner.temp }}/api-diagnostic.jsonl
          if-no-files-found: ignore
  codex:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Codex independently of Gemini
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ inputs.codex_model }}
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'
          prompt: 연결 확인 시험입니다. 도구를 사용하거나 파일과 환경 변수를 읽지 말고 연결됨이라는 한 단어만 답하세요.
