<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gem-Codex 변경 승인</title><style>body{font:17px/1.6 system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f4f6fa;color:#152238}section{background:white;padding:24px;margin:20px 0;border-radius:12px}input,button{font:inherit;padding:10px;margin:6px 0;box-sizing:border-box}input{width:100%}button{background:#1746a2;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}#message{position:sticky;bottom:10px;background:#e1ebff;padding:16px;white-space:pre-wrap}a{color:#1746a2}</style>
<h1>변경 내용을 확인하고 승인하세요</h1><p>기본 정책: 모든 변경에 새 OTP 필요 · 최종 반영 전 검사 통과 필요</p>
<section><h2>1. GitHub 연결</h2><p>이 저장소에만 접근하는 토큰을 입력하세요. 토큰은 창이 실행되는 동안 메모리에만 보관됩니다.</p><input id="token" type="password" autocomplete="off" placeholder="GitHub 연결 토큰" aria-label="GitHub 연결 토큰"><button id="connect">연결</button></section>
<section id="enrollment"><h2>2. Authenticator 등록 (처음 한 번)</h2><button id="enroll">등록용 설정 키 만들기</button><pre id="secret"></pre><input id="setupOtp" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="등록 확인용 6자리 번호" aria-label="등록 확인용 OTP"><button id="confirm">등록 확인</button></section>
<section><h2>3. 반영할 변경 확인</h2><p>GitHub에서 초안 PR을 확인하고 Ready for review로 전환한 다음, 이 화면에 PR 번호를 입력하세요.</p><input id="number" inputmode="numeric" placeholder="PR 번호" aria-label="PR 번호"><button id="preview">PR 확인</button><pre id="details"></pre><a id="link" hidden target="_blank" rel="noopener noreferrer">GitHub에서 변경 내용 보기</a></section>
<section><h2>4. OTP로 최종 반영</h2><input id="otp" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Authenticator 6자리 번호" aria-label="승인용 OTP"><button id="approve" disabled>확인한 변경을 승인하고 반영</button></section>
<p id="message" role="status">준비 중…</p><script src="/app.js"></script></html>
